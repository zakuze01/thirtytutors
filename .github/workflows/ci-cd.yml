name: Companion Lite CI (no publishing)

# ThirtyTutors's suite has no heavy
# model-download tests to separate out (speech_detection's real ML backend
# is mocked in every test - see tests/conftest.py's fake_speaker_backend),
# so there's just one test job.
#
# Not covered here: cli.py's platform-specific shortcut creation
# (Windows .lnk / macOS .app / Linux .desktop) and the actual desktop
# window (pywebview). Both are excluded from coverage (see pyproject.toml)
# and only ever verified manually - they need a real Windows/macOS/Linux
# desktop session to mean anything, which a CI runner isn't.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Upgrade build tools
        run: python -m pip install --upgrade pip setuptools wheel
      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: |
          pytest tests/ \
            -x --tb=short -q \
            --cov=thirtytutors \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/test_speech_gate.cjs
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 7

  build-check:
    name: Package build check
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*

  # Publishing intentionally absent in the personal fork. No OIDC credentials,
  # tag-triggered publishing, PyPI upload, or GitHub Release job is permitted.
