name: Windows private build validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - run: python -m pip install -r packaging/windows/requirements-build.lock.txt
      - run: python -m pip install -e . --no-deps
      - run: python -m pytest tests/ -v --cov --cov-report=term-missing
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python packaging/windows/prepare_licenses.py
      - run: python -m PyInstaller packaging/windows/CompanionLite.spec --noconfirm
      - run: choco install nsis -y --no-progress
      - shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\NSIS\makensis.exe" packaging/windows/installer.nsi'
      - run: python packaging/windows/build_manifest.py
      # Deliberately no release, PyPI publish, or installer artifact upload.
